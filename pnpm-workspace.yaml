packages:
  - apps/*
  - packages/*
allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false

dangerouslyAllowAllBuilds: false
# Makes a skipped build a hard failure, not a silent one.
strictDepBuilds: true

# 3 days. For an urgent advisory, exempt the one fixed package through
# minimumReleaseAgeExclude instead of lowering this.
minimumReleaseAge: 4320

# Judge only the last 30 days: pre-2023 releases predate provenance and trip
# this constantly.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200

engineStrict: true
verifyDepsBeforeRun: "error"
verifyStoreIntegrity: true

# Owner: repository owner; temporary exception accepted 2026-10-07.
# Assessed: shadcn 4.21.0 / braces 3.0.3; no published fix. The web app imports
# only shadcn's stylesheet; braces is reached through the shadcn CLI with
# developer-written globs. Reassessed 2026-10-18 at shadcn 4.21.4 /
# @shadcn/registry 0.1.3; shadcn 4.22.0 keeps the same fast-glob path.
# Next review: 2026-10-25, then weekly against upstream advisory/releases.
# Reassess on dependency, usage, or advisory changes.
# Install/test a patched release and remove this exception after upgrading.
# Evidence: docs/research/unpatched-dependency-audit-exceptions.md
# https://github.com/advisories/GHSA-vfj7-8cjw-p6xm
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

# drizzle-kit's deprecated @esbuild-kit loader bundles esbuild 0.18.20
# (GHSA-67mh-4wv8-2f99). Point it at the 0.25 that drizzle-kit itself uses.
# Drop this once drizzle-kit drops @esbuild-kit.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # GHSA-r3ph-w7gj-g6xm. Remove once markdownlint-cli accepts a patched js-yaml.
  "markdownlint-cli>js-yaml": 5.4.2
  # GHSA-r4xh-jqrq-34v2. Remove once markdownlint-cli accepts smol-toml 1.9.
  "markdownlint-cli>smol-toml": 1.9.0
  # GHSA-238p-pmpm-9mq7. Remove once micromark-extension-math accepts katex 0.18.
  "micromark-extension-math>katex": 0.18.10
