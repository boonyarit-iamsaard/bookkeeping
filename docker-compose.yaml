name: bookkeeping

services:
  postgres:
    image: postgres:18-alpine
    container_name: bookkeeping-postgres
    environment:
      POSTGRES_DB: bookkeeping
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - bookkeeping-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bookkeeping-network

volumes:
  bookkeeping-postgres-data:
    name: bookkeeping-postgres-data

networks:
  bookkeeping-network:
    name: bookkeeping-network
