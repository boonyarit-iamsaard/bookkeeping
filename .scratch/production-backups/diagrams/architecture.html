<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Production backups</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --muted: #6b7183;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #13151c;
          --muted: #9aa0b2;
        }
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
      body {
        padding: 16px;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      figure {
        margin: 0 auto;
        max-width: 1200px;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
      }
      figcaption {
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <figure>
      <img
        src="architecture.svg"
        alt="A nightly cron service inside Railway dumps PostgreSQL and uploads an age-encrypted copy, with upload-only access, to an S3 bucket under Object Lock in a dedicated AWS account. An EventBridge schedule runs a Lambda that emails the owner through SNS when a backup is missing. The owner restores backups on their own machine to prove they work."
      />
      <figcaption>
        Every night the ledger leaves Railway encrypted, lands in a bucket
        nobody can empty, and is proven restorable on the owner's machine.
      </figcaption>
    </figure>
  </body>
</html>
