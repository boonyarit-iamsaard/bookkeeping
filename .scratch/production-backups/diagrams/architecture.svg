<!-- Production backup architecture. Hand-written SVG; preview with architecture.html. -->
<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" viewBox="24 54 1176 610" role="img" aria-labelledby="t d">
<style>
  :root {
    --bg: #ffffff;
    --ink: #1f2330;
    --muted: #6b7183;
    --line: #8a90a2;
    --card: #ffffff;
    --card-stroke: #e3e5ec;
    --shadow: rgba(24, 28, 40, 0.08);
    --railway: #7c3aed;
    --railway-wash: rgba(124, 58, 237, 0.04);
    --aws: #e8890c;
    --aws-wash: rgba(232, 137, 12, 0.045);
    --sub: #9aa0b2;
    --put: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13151c;
      --ink: #e8eaf0;
      --muted: #9aa0b2;
      --line: #7d8396;
      --card: #1c1f29;
      --card-stroke: #2c3040;
      --shadow: rgba(0, 0, 0, 0.35);
      --railway: #a78bfa;
      --railway-wash: rgba(167, 139, 250, 0.06);
      --aws: #f5a524;
      --aws-wash: rgba(245, 165, 36, 0.06);
      --sub: #5d6378;
      --put: #58a6ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13151c; --ink: #e8eaf0; --muted: #9aa0b2; --line: #7d8396;
    --card: #1c1f29; --card-stroke: #2c3040; --shadow: rgba(0, 0, 0, 0.35);
    --railway: #a78bfa; --railway-wash: rgba(167, 139, 250, 0.06);
    --aws: #f5a524; --aws-wash: rgba(245, 165, 36, 0.06);
    --sub: #5d6378; --put: #58a6ff;
  }

  .group { fill: none; stroke-width: 1.5; }
  .group.railway { stroke: var(--railway); fill: var(--railway-wash); }
  .group.aws { stroke: var(--aws); fill: var(--aws-wash); }
  .group.sub { stroke: var(--sub); stroke-dasharray: 5 5; fill: none; }
  .glabel { font-size: 15px; font-weight: 650; }
  .glabel.railway { fill: var(--railway); }
  .glabel.aws { fill: var(--aws); }
  .slabel { font-size: 12.5px; font-weight: 600; fill: var(--muted); }

  .card rect.box { fill: var(--card); stroke: var(--card-stroke); stroke-width: 1; filter: drop-shadow(0 1px 2px var(--shadow)) drop-shadow(0 4px 10px var(--shadow)); }
  .card.dashed rect.box { stroke-dasharray: 5 4; stroke: var(--sub); filter: none; }
  .title { font-size: 14px; font-weight: 600; fill: var(--ink); }
  .meta { font-size: 12px; fill: var(--muted); }
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: var(--muted); }
  .tile text { font-size: 12px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }

  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .edge.dash { stroke-dasharray: 5 5; }
  .edge.put { stroke: var(--put); stroke-width: 3; }
  .elabel { font-size: 12px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  .elabel.put { fill: var(--put); font-weight: 600; }
  .arrow { fill: var(--line); }
  .arrow.put { fill: var(--put); }
</style>
  <rect x="24" y="54" width="1176" height="610" fill="var(--bg)"/>
  <title id="t">Production backups architecture</title>
  <desc id="d">A nightly cron service inside Railway dumps PostgreSQL and uploads an age-encrypted copy, with upload-only access, to an S3 bucket under Object Lock in a dedicated AWS account. An EventBridge schedule runs a Lambda that emails the owner through SNS when a backup is missing. The owner restores backups on their own machine to prove they work.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="arrow put" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Railway -->
  <rect class="group railway" x="40" y="70" width="400" height="450" rx="16"/>
  <g transform="translate(60 84)">
    <rect width="26" height="26" rx="7" fill="var(--railway)"/>
    <path d="M7 17 L13 9 L19 17 M9.5 14 H16.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="glabel railway" x="36" y="18">Railway · production</text>
  </g>
  <rect class="group sub" x="60" y="128" width="360" height="230" rx="12"/>
  <text class="slabel" x="76" y="150">private network</text>

  <!-- AWS -->
  <rect class="group aws" x="470" y="70" width="690" height="450" rx="16"/>
  <g transform="translate(490 84)">
    <rect width="26" height="26" rx="7" fill="var(--aws)"/>
    <text x="13" y="14" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">aws</text>
    <text class="glabel aws" x="36" y="18">AWS · backups account</text>
    <text class="meta" x="650" y="18" text-anchor="end">ap-southeast-1</text>
  </g>
  <rect class="group sub" x="820" y="128" width="320" height="270" rx="12"/>
  <text class="slabel" x="836" y="150">missing-backup check</text>

  <!-- Edges (drawn under cards) -->
  <path class="edge" d="M220 226 V 276" marker-end="url(#a)"/>
  <text class="elabel" x="232" y="250">pg_dump + manifest</text>
  <text class="elabel" x="232" y="265">one snapshot</text>

  <path class="edge dash" d="M90 198 C 72 198, 72 428, 84 428" marker-end="url(#a)"/>
  <text class="elabel" x="96" y="384">daily · weekly · monthly</text>

  <path class="edge put" d="M350 308 H 504" marker-end="url(#ap)"/>
  <text class="elabel put" x="456" y="296" text-anchor="middle">PutObject only</text>
  <text class="elabel put" x="456" y="330" text-anchor="middle">age-encrypted</text>

  <path class="edge" d="M975 217 V 241" marker-end="url(#a)"/>
  <path class="edge" d="M975 297 V 321" marker-end="url(#a)"/>
  <text class="elabel" x="986" y="313">missing</text>
  <path class="edge" d="M845 271 C 815 271, 815 290, 796 290" marker-end="url(#a)"/>
  <text class="elabel" x="790" y="246" text-anchor="end">list daily/</text>

  <path class="edge" d="M1105 351 C 1150 351, 1150 560, 1110 590" marker-end="url(#a)"/>
  <text class="elabel" x="1158" y="470">email</text>
  <path class="edge dash" d="M975 482 C 975 540, 1010 560, 1018 586" marker-end="url(#a)"/>
  <text class="elabel" x="1000" y="540">email</text>

  <path class="edge" d="M980 615 H 796" marker-end="url(#a)"/>
  <text class="elabel" x="888" y="605" text-anchor="middle">age private key</text>
  <path class="edge" d="M650 590 V 371" marker-end="url(#a)"/>
  <text class="elabel" x="662" y="556">aws sso login · read</text>

  <!-- Cards -->
  <g class="card" transform="translate(90 170)">
    <rect class="box" width="260" height="56" rx="10"/>
    <g class="tile" transform="translate(14 14)"><rect width="28" height="28" rx="7" fill="#336791"/><text x="14" y="14">PG</text></g>
    <text class="title" x="54" y="25">PostgreSQL 18</text>
    <text class="meta" x="54" y="42">ledger · auth · receipts</text>
  </g>
  <g class="card" transform="translate(90 280)">
    <rect class="box" width="260" height="56" rx="10"/>
    <g class="tile" transform="translate(14 14)"><rect width="28" height="28" rx="7" fill="var(--railway)"/><circle cx="14" cy="14" r="7.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M14 10 V14 L17 16" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    <text class="title" x="54" y="25">backup cron</text>
    <text class="meta" x="54" y="42">03:00 Asia/Bangkok · nightly</text>
  </g>
  <g class="card dashed" transform="translate(90 400)">
    <rect class="box" width="260" height="56" rx="10"/>
    <g class="tile" transform="translate(14 14)"><rect width="28" height="28" rx="7" fill="#8a90a2"/><rect x="7" y="9" width="14" height="10" rx="2" fill="none" stroke="#fff" stroke-width="2"/></g>
    <text class="title" x="54" y="25">Railway volume backups</text>
    <text class="meta" x="54" y="42">first layer · same account</text>
  </g>

  <g class="card" transform="translate(510 255)">
    <rect class="box" width="280" height="110" rx="10"/>
    <g class="tile" transform="translate(14 14)"><rect width="28" height="28" rx="7" fill="#3f8624"/><text x="14" y="14">S3</text></g>
    <text class="title" x="54" y="25">S3 bucket</text>
    <text class="meta" x="54" y="42">versioned · SSE-S3 · TLS only</text>
    <text class="mono" x="16" y="70">Object Lock  compliance · 35 d</text>
    <text class="mono" x="16" y="86">daily/       kept 35 days</text>
    <text class="mono" x="16" y="102">monthly/     kept 12 months</text>
  </g>

  <g class="card" transform="translate(845 165)">
    <rect class="box" width="260" height="52" rx="10"/>
    <g class="tile" transform="translate(12 12)"><rect width="28" height="28" rx="7" fill="#e7157b"/><text x="14" y="14">EB</text></g>
    <text class="title" x="52" y="24">EventBridge</text>
    <text class="meta" x="52" y="40">09:00 every morning</text>
  </g>
  <g class="card" transform="translate(845 245)">
    <rect class="box" width="260" height="52" rx="10"/>
    <g class="tile" transform="translate(12 12)"><rect width="28" height="28" rx="7" fill="#ed7100"/><text x="14" y="14" font-size="15">λ</text></g>
    <text class="title" x="52" y="24">Lambda</text>
    <text class="meta" x="52" y="40">newest backup older than 26 h?</text>
  </g>
  <g class="card" transform="translate(845 325)">
    <rect class="box" width="260" height="52" rx="10"/>
    <g class="tile" transform="translate(12 12)"><rect width="28" height="28" rx="7" fill="#e7157b"/><text x="14" y="14" font-size="9.5">SNS</text></g>
    <text class="title" x="52" y="24">SNS topic</text>
    <text class="meta" x="52" y="40">one email subscription</text>
  </g>
  <g class="card" transform="translate(845 430)">
    <rect class="box" width="260" height="52" rx="10"/>
    <g class="tile" transform="translate(12 12)"><rect width="28" height="28" rx="7" fill="#3f8624"/><text x="14" y="14">$</text></g>
    <text class="title" x="52" y="24">Budgets</text>
    <text class="meta" x="52" y="40">alert past $1 a month</text>
  </g>

  <g class="card" transform="translate(510 590)">
    <rect class="box" width="280" height="56" rx="10"/>
    <g class="tile" transform="translate(14 14)"><rect width="28" height="28" rx="7" fill="#4b5563"/><rect x="6" y="8" width="16" height="10" rx="1.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M4 21 H24" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <text class="title" x="54" y="25">Restore drill</text>
    <text class="meta" x="54" y="42">postgres:18 · compare to manifest</text>
  </g>
  <g class="card" transform="translate(980 590)">
    <rect class="box" width="150" height="56" rx="10"/>
    <g class="tile" transform="translate(14 14)"><rect width="28" height="28" rx="14" fill="#4b5563"/><circle cx="14" cy="11" r="4" fill="#fff"/><path d="M7 22 C7 16, 21 16, 21 22" fill="#fff"/></g>
    <text class="title" x="54" y="25">Owner</text>
    <text class="meta" x="54" y="42">age private key</text>
  </g>
</svg>
