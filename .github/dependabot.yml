version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Waits before proposing a release, so a bad publish has time to surface.
    cooldown:
      default-days: 3
    groups:
      # Keeps review load sane.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    # The runtime and toolchain move to a new major when the owner decides, not
    # when a release appears. Minor and patch still arrive weekly. A Node major
    # also changes `@types/node`, the Dockerfiles, CI and `engines`, so bump
    # them together.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: turbo
        update-types: ["version-update:semver-major"]
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-major"]

  # Without this the SHA pins rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The docker fetcher is not recursive, so each Dockerfile directory needs its
  # own entry. Both keep the tag beside the digest so the pair can be updated.
  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # The runtime major moves when the owner decides, not when a tag appears.
    # Bump `FROM`, `engines` and `@types/node` together.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: caddy
        update-types: ["version-update:semver-major"]
