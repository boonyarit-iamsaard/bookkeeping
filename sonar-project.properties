sonar.projectKey=bookkeeping
sonar.projectName=Bookkeeping
sonar.sourceEncoding=UTF-8

sonar.sources=apps/web/src,apps/server/src,packages/domain/src,packages/database/src,packages/application/src,packages/auth/src,infra/aws
sonar.tests=apps/web/src,apps/web/tests,apps/server/src,packages/domain/src,packages/database/src,packages/application/src,packages/auth/src
sonar.test.inclusions=apps/web/src/**/*.unit.test.ts,apps/web/tests/**,apps/server/src/**/*.unit.test.ts,apps/server/src/**/*.integration.test.ts,packages/domain/src/**/*.unit.test.ts,packages/database/src/**/*.unit.test.ts,packages/database/src/**/*.integration.test.ts,packages/application/src/**/*.unit.test.ts,packages/application/src/**/*.integration.test.ts,packages/auth/src/**/*.integration.test.ts
sonar.exclusions=apps/web/src/**/*.unit.test.ts,apps/web/src/routeTree.gen.ts,apps/web/src/core/api/openapi.gen.ts,apps/server/src/**/*.unit.test.ts,apps/server/src/**/*.integration.test.ts,packages/domain/src/**/*.unit.test.ts,packages/database/src/**/*.unit.test.ts,packages/database/src/**/*.integration.test.ts,packages/application/src/**/*.unit.test.ts,packages/application/src/**/*.integration.test.ts,packages/auth/src/**/*.integration.test.ts
sonar.typescript.tsconfigPaths=apps/web/tsconfig.json,apps/server/tsconfig.json,packages/domain/tsconfig.json,packages/database/tsconfig.json,packages/application/tsconfig.json,packages/auth/tsconfig.json

# S3 access logging on the backup bucket is accepted as unneeded; the reason
# is recorded above the bucket in infra/aws/backups.yaml.
sonar.issue.ignore.multicriteria=s3logging
sonar.issue.ignore.multicriteria.s3logging.ruleKey=cloudformation:S6258
sonar.issue.ignore.multicriteria.s3logging.resourceKey=infra/aws/backups.yaml
