sonar.projectKey=bookkeeping
sonar.projectName=Bookkeeping
sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages,scripts,infra,.railway/railway.ts,commitlint.config.ts,vitest.config.mts
sonar.tests=apps,packages,scripts
sonar.test.inclusions=**/*.test.ts,apps/web/tests/**
sonar.exclusions=**/*.test.ts,apps/web/tests/**,apps/web/src/routeTree.gen.ts,apps/web/src/core/api/openapi.gen.ts
sonar.typescript.tsconfigPaths=tsconfig.json,apps/web/tsconfig.json,apps/server/tsconfig.json,packages/domain/tsconfig.json,packages/database/tsconfig.json,packages/application/tsconfig.json,packages/auth/tsconfig.json

# S3 access logging on the backup bucket and KMS encryption on the alert topic
# are accepted as unneeded; the reasons are recorded above each resource in
# infra/aws/backups.yaml.
sonar.issue.ignore.multicriteria=s3logging,snsencryption
sonar.issue.ignore.multicriteria.s3logging.ruleKey=cloudformation:S6258
sonar.issue.ignore.multicriteria.s3logging.resourceKey=infra/aws/backups.yaml
sonar.issue.ignore.multicriteria.snsencryption.ruleKey=cloudformation:S6327
sonar.issue.ignore.multicriteria.snsencryption.resourceKey=infra/aws/backups.yaml
