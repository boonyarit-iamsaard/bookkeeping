sonar.projectKey=bookkeeping
sonar.projectName=Bookkeeping
sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages,scripts,infra,.railway/railway.ts,commitlint.config.ts,vitest.config.mts
sonar.tests=apps,packages,scripts
sonar.test.inclusions=**/*.test.ts,apps/web/tests/**
sonar.exclusions=**/*.test.ts,apps/web/tests/**,apps/web/src/routeTree.gen.ts,apps/web/src/core/api/openapi.gen.ts
sonar.typescript.tsconfigPaths=tsconfig.json,apps/web/tsconfig.json,apps/server/tsconfig.json,packages/domain/tsconfig.json,packages/database/tsconfig.json,packages/application/tsconfig.json,packages/auth/tsconfig.json

sonar.issue.ignore.multicriteria=s3logging,snsencryption,localcheckpath,commithookpath,scanpath,walletstate,databasepoll,diagramrender,analysispoll,serverpoll

# S9382 exceptions are file-wide; review new async loops independently.
# Each wallet change records the preceding change's resulting state in one transaction.
sonar.issue.ignore.multicriteria.walletstate.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.walletstate.resourceKey=packages/application/src/wallets/wallet-state.ts

# Polling waits for PostgreSQL backends to exit before attempting a forced drop.
sonar.issue.ignore.multicriteria.databasepoll.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.databasepoll.resourceKey=packages/database/src/testing/empty-database.ts

# Render one page at a time to bound Chromium memory, closing it before the next.
sonar.issue.ignore.multicriteria.diagramrender.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.diagramrender.resourceKey=scripts/render-diagrams.ts

# Polling waits for state changes; pagination stays sequential to limit server load.
sonar.issue.ignore.multicriteria.analysispoll.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.analysispoll.resourceKey=scripts/sonar/report.ts

# Startup polling waits between attempts and stops as soon as SonarQube is ready.
sonar.issue.ignore.multicriteria.serverpoll.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.serverpoll.resourceKey=scripts/sonar/server.ts

# Local/CI checks run fixed Git commands through the runner's trusted PATH.
sonar.issue.ignore.multicriteria.localcheckpath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.localcheckpath.resourceKey=scripts/check-*.ts

# Commit hooks use the developer's trusted PATH to find their Git installation.
sonar.issue.ignore.multicriteria.commithookpath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.commithookpath.resourceKey=scripts/commitlint/staged-paths.ts

# The local scan runner uses fixed Docker commands through the developer's trusted PATH.
sonar.issue.ignore.multicriteria.scanpath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.scanpath.resourceKey=scripts/sonar/stack.ts

# Backup bucket access logging is accepted as unneeded; see infra/aws/backups.yaml.
sonar.issue.ignore.multicriteria.s3logging.ruleKey=cloudformation:S6258
sonar.issue.ignore.multicriteria.s3logging.resourceKey=infra/aws/backups.yaml

# Alert topic KMS encryption is accepted as unneeded; see infra/aws/backups.yaml.
sonar.issue.ignore.multicriteria.snsencryption.ruleKey=cloudformation:S6327
sonar.issue.ignore.multicriteria.snsencryption.resourceKey=infra/aws/backups.yaml
