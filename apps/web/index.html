<!doctype html>
<html lang="en" class="h-full antialiased font-sans">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget lets the layout viewport shrink when the on-screen keyboard opens. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Light chrome until the script below shows the chosen scheme. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!-- Shows the stored Appearance choice before first paint; mirrors
         src/core/shell/appearance.ts; appearance-sync.ts takes over once the
         app loads. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("bookkeeping.appearance");
        } catch (error) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.scheme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#14141c" : "#ffffff");
      })();
    </script>
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
    />
    <title>Bookkeeping</title>
  </head>
  <body class="flex min-h-full flex-col">
    <div id="root" class="flex min-h-full flex-1 flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
