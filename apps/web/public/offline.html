<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f5ed9" />
    <link rel="icon" href="/favicon.ico" />
    <title>Bookkeeping</title>
    <!-- Served by the service worker when a launch cannot reach the network,
         so it carries its own styles: Paper ground, Ink text, one Cobalt action. -->
    <style>
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --primary: oklch(0.52 0.2 262);
        --primary-foreground: oklch(0.985 0 0);
        --ring: oklch(0.52 0.2 262);
      }
      html {
        height: 100%;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: var(--background);
        color: var(--foreground);
      }
      body {
        margin: 0;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        padding: 24px 16px;
        max-width: 28rem;
        width: 100%;
        box-sizing: border-box;
        margin: 0 auto;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.5rem;
        color: var(--muted-foreground);
      }
      button {
        height: 48px;
        width: 100%;
        border: 0;
        border-radius: 26px;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: color-mix(in oklch, var(--primary) 80%, transparent);
      }
      button:active {
        transform: translateY(1px);
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Bookkeeping needs a connection to show your wallets and transactions.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
