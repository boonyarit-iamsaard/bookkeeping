<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f4fa" />
    <meta name="color-scheme" content="light dark" />
    <!-- Shows the stored Appearance choice before first paint and follows
         the OS under System; mirrors src/core/shell/appearance.ts and
         appearance-sync.ts, since this page has no app to take over. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("bookkeeping.appearance");
        } catch (error) {}
        var system = matchMedia("(prefers-color-scheme: dark)");
        function show() {
          var dark =
            stored === "dark" || (stored !== "light" && system.matches);
          document.documentElement.dataset.scheme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0e0e14" : "#f4f4fa");
        }
        show();
        // Under System, an open offline page follows the OS like the app.
        system.addEventListener("change", show);
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <title>Bookkeeping</title>
    <!-- Served by the service worker when a launch cannot reach the network,
         so it carries its own styles: the iris-tinted ground, one white card and
         one Iris action, in light and dark. Offline, Inter cannot load, so the
         system sans stands in on this one page. -->
    <style>
      :root {
        color-scheme: light;
        --background: oklch(0.968 0.008 285);
        --card: oklch(1 0 0);
        --foreground: oklch(0.21 0.025 285);
        --muted-foreground: oklch(0.5 0.022 285);
        --primary: oklch(0.54 0.21 285);
        --primary-foreground: oklch(1 0 0);
        --ring: oklch(0.54 0.21 285);
      }
      :root[data-scheme="dark"] {
        color-scheme: dark;
        --background: oklch(0.165 0.014 285);
        --card: oklch(0.215 0.018 285);
        --foreground: oklch(0.965 0.006 285);
        --muted-foreground: oklch(0.73 0.02 285);
        --primary: oklch(0.56 0.2 285);
        --ring: oklch(0.7 0.15 285);
      }
      html {
        height: 100%;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: var(--background);
        color: var(--foreground);
      }
      body {
        margin: 0;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      main {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        padding: 28px 24px;
        max-width: 28rem;
        width: calc(100% - 32px);
        box-sizing: border-box;
        margin: auto;
        flex: 0 1 auto;
        border-radius: 20px;
        background: var(--card);
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.5rem;
        color: var(--muted-foreground);
      }
      button {
        height: 48px;
        width: 100%;
        border: 0;
        margin-top: 8px;
        border-radius: 14px;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: color-mix(in oklch, var(--primary), black 12%);
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Bookkeeping needs a connection to show your wallets and transactions.
      </p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
